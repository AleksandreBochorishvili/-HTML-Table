<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პრაქტიკული დავალება — HTML Table</title>
</head>
<body>
    <header>
        <h1>
            HTML Currency Symbols, Currency Entities and ASCII Currency Character Code Reference
        </h1>
        <br>
        <hr>
    </header>
    <body>
        <table border="2">
            <thead>
                <th>Symbol</th>
                <th>html code</th>
                <th>name</th>
            </thead>
            <tbody>
                <td>&copy;</td>
                <td><code>&amp;copy;</code></td>
                <td>Copyright Sign</td>
            </tbody>
            <tr>
                <td>&reg;</td>
                <td><code>&amp;reg;</code></td>
                <td>Registered Trade Mark Sign</td>
            </tr>
            <tr>
                <td>&trade;</td>
                <td><code>&amp;trade;</code></td>
                <td>Trade Mark Sign</td>
            </tr>
            <tr>
                <td>&commat;</td>
                <td><code>&amp;commat;</code></td>
                <td>At Symbol</td>
            </tr>
            <tr>
                <td>&#9755;</td>
                <td><code>&amp;9755;</code></td>
                <td>Black Right Pointing Index</td>
            </tr>
        </table>
    </body>
    
</body>
</html>
